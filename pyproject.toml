[project]
name = "ai-brain"
version = "0.1.0"
description = "Vendor-agnostic, event-driven AI Knowledge Operating System for an Obsidian vault"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "python-frontmatter>=1.1.0",
    "pyyaml>=6.0",
    "huey>=2.5.0",
    "detect-secrets>=1.5.0",
]

[project.scripts]
ai-brain = "ai_brain.cli:main"

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "ruff>=0.6.0",
    "mypy>=1.11",
    "types-PyYAML",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/ai_brain"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-ra"

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "S", "A"]
# S101: allow `assert` in tests.
per-file-ignores = { "tests/**/*.py" = ["S101"] }

[tool.mypy]
python_version = "3.12"
strict = true
files = ["src"]
warn_unused_ignores = true

[[tool.mypy.overrides]]
# huey ships no py.typed marker/stubs (verified during hardening-module implementation).
module = "huey.*"
ignore_missing_imports = true
